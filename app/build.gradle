plugins {
    id 'com.android.application'
}

android {
    namespace 'com.terence.accessibilitykeeper'
    compileSdk 36

    defaultConfig {
        applicationId 'com.terence.accessibilitykeeper'
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName '0.1.5'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
